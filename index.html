<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APlane</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f2;
      --text: #111111;
      --panel: #111111;
      --command: #f8f8f2;
      --muted: #5b5f66;
      --border: #d7dacd;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      justify-items: center;
      align-items: start;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      padding: 12px 16px 32px;
    }

    main {
      width: min(980px, 100%);
      text-align: center;
    }

    img {
      display: block;
      width: min(400px, 82vw);
      height: auto;
      margin: 0 auto 16px;
    }

    .tagline {
      margin: 0 auto 16px;
      color: var(--text);
      font-size: 18px;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 16px;
    }

    a {
      color: var(--muted);
      text-decoration: none;
      font-size: 18px;
    }

    a:hover,
    a:focus {
      color: var(--text);
      text-decoration: underline;
    }

    .alpha-warning {
      margin-top: 20px;
      color: #cc2200;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main>
    <img src="img/aplane.png" alt="APlane">
    <div class="tagline">APlane Signer and Shell for Linux and MacOS</div>
    <nav aria-label="Project links">
      <a href="https://github.com/aplane-algo/aplane">Github</a>
      <a href="https://github.com/aplane-algo/aplane/blob/main/README.md">README</a>
      <a href="https://github.com/aplane-algo/aplane/blob/main/docs/USER_QUICKSTART.md">Quickstart</a>
    </nav>
    <div class="alpha-warning">This is experimental software. Please use conservatively.</div>
  </main>
</body>
</html>
